name: Build Cadence (Windows)

# Builds the Cadence Windows installer + portable .exe and uploads them as a
# downloadable artifact. Runs on pushes that touch the app, and can be started
# by hand from the Actions tab (Run workflow). Tagging a release attaches the
# .exe files to that GitHub Release.
#
# The .exe is cross-built on Linux using electron-builder's official Wine image,
# so it doesn't depend on GitHub-hosted Windows runners being available.

on:
  push:
    branches:
      - claude/youtube-music-spotify-skin-y12b5t
    paths:
      - "cadence/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows installer (Wine cross-build)
        run: |
          docker run --rm --user root \
            -v "$PWD":/project \
            -w /project/cadence \
            electronuserland/builder:wine \
            bash -c "node --version && npm install --no-audit --no-fund && npm run dist"

      - name: List build output
        run: ls -la cadence/dist

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Windows
          path: cadence/dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" cadence/dist/*.exe --clobber
