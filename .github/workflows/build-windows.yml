name: Build Cadence (Windows)

# Builds the Cadence Windows installer + portable .exe and uploads them as a
# downloadable artifact. Runs on pushes that touch the app, and can be started
# by hand from the Actions tab (Run workflow). Tagging a release (v*) also
# attaches the .exe files to the GitHub Release.

on:
  push:
    branches:
      - claude/youtube-music-spotify-skin-y12b5t
    paths:
      - "cadence/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cadence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cadence/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows app
        run: npm run dist
        env:
          # Avoid electron-builder trying to auto-publish anywhere.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-Windows
          path: |
            cadence/dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: cadence/dist/*.exe
